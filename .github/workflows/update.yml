name: Обновить ленту

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17 (UTC)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write   # чтобы сохранить data/news.json в репозиторий
  models: read      # бесплатный доступ к GitHub Models

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать и пересказать новости
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py

      - name: Сохранить изменения
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Новых новостей нет"
          else
            git commit -m "Обновление ленты $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
